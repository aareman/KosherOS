name: Bump the base images

# The Containerfile builds FROM our own copy of Fedora's images, pinned by
# digest, so the build cache holds between builds (scripts/bump-base.py
# says why a copy: quay.io deletes Fedora's old digests). Once a week this
# copies Fedora's current images into the registry under a dated tag and
# moves the pins to them, in a pull request queued for the merge train,
# which tests the new base in a VM before it lands.
#
# Run by hand with a branch to pin on that branch instead of opening a pull
# request (how the first copy was made).

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays, early morning US Eastern
  workflow_dispatch:
    inputs:
      branch:
        description: pin on this branch instead of opening a pull request
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  packages: write # the copies
  actions: write  # waking the train: a pull request this token opens wakes nothing itself

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}
      - name: Copy Fedora's images and pin to the copies
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skopeo login ghcr.io -u "$GITHUB_ACTOR" -p "$GH_TOKEN"
          python3 scripts/bump-base.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit to the branch asked for
        if: steps.pin.outputs.changed == 'true' && inputs.branch != ''
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name "KosherOS base bump"
          git config user.email "bump-base@users.noreply.github.com"
          git commit -qam "Build FROM our copy of Fedora's base images, $(date -u +%Y-%m-%d)"
          git push -q origin "HEAD:refs/heads/$BRANCH"
      - name: A pull request, queued
        if: steps.pin.outputs.changed == 'true' && inputs.branch == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/bump-base-$(date -u +%Y%m%d)"
          git config user.name "KosherOS base bump"
          git config user.email "bump-base@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -qam "chore: Fedora's base images as of $(date -u +%Y-%m-%d)"
          git push -q origin "$branch"
          gh pr create --base master --head "$branch" --label queued \
            --title "chore: Fedora's base images as of $(date -u +%Y-%m-%d)" \
            --body "The weekly copy of Fedora's \`fedora:44\` and \`fedora-bootc:44\` into our registry, and the Containerfile pinned to it (\`scripts/bump-base.py\`). Queued: the merge train tests it in a VM and lands it."
          gh workflow run merge-train.yml --ref master
