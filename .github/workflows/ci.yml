name: Checks

# Everything that can be verified without a VM or an image build. The
# in-VM integration suites (scripts/vm-tests/) need KVM and a provisioned
# Fedora guest, so they stay a local `just test-vm` step.

on:
  push:
    branches: [master]
  pull_request:
  # "Rebuild and publish edge now", for when the last commits touched
  # nothing in the image and a fresh one is wanted anyway — before
  # promoting a version to stable, for instance.
  workflow_dispatch:

concurrency:
  # One Pages deployment at a time; a second push while one is publishing
  # waits rather than racing it.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version this merge
    # One version per push to master — per merge — rather than one per
    # commit. How far it steps (minor for a feat, patch otherwise, never
    # major) is scripts/version.py's business, from the commit subjects. The dev shell used to tick VERSION in a pre-commit
    # hook, which numbered every commit on every branch; a five-commit
    # branch spent five versions to land one change, and that was judged
    # excessive. Now CI ticks it once, here, commits the tick to master and
    # builds THAT commit. The push is made with the workflow's own token,
    # which does not start another run, and the message says [skip ci]
    # besides, so a token that would cannot loop either. Serialised, so two
    # merges in quick succession take two numbers rather than fighting over
    # one.
    #
    # Mind the skip marker: GitHub honours it ANYWHERE in a pushed commit's
    # message, body included. The commit that introduced this job quoted
    # it in its own message, and that push got no run at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: version-bump
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On top of whatever master is NOW, which includes the tick a run
          # just before this one may have pushed.
          git fetch --quiet origin master
          git reset --hard --quiet origin/master
          new="$(python3 scripts/version.py bump)"
          new="${new#version: }"
          git commit --quiet -m "chore: version $new [skip ci]" -- VERSION
          git push --quiet origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "this merge is $new"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python with GObject
        # The daemon imports gi at module level, so every test that touches
        # it needs PyGObject. The distro's python3-gi is the dependable way
        # to get it (pip would build it from source); the runner's system
        # Python is 3.12, the same as the dev shell. nftables: test_nft.py
        # syntax-checks the rendered ruleset with the real parser.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 python3-pip nftables
          python3 -m pip install --break-system-packages \
            pytest pytest-cov jsonschema cryptography fastapi httpx pillow pyyaml
      - name: Device tests with coverage
        run: |
          cd kosherd
          python3 -m pytest tests/ -q \
            --cov=kosherd --cov-report=term-missing:skip-covered \
            --cov-fail-under=85
      - name: Portal tests
        run: cd portal && PYTHONPATH=src:../kosherd/src python3 -m pytest tests/ -q

  compile:
    name: Apps compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Byte-compile every app
        # The GTK apps and the daemon need GObject typelibs to RUN, which
        # CI has no reason to install — but a syntax error must still fail
        # here rather than in a VM.
        run: |
          python3 -m compileall -q \
            kosherd/src admin-app/src store-app/src setup-app/src \
            myfilter-app/src portal/src mitm

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          # SC1091: lib.sh is sourced at runtime inside the VM.
          # The greenboot health check decides whether a booted image is
          # kept or rolled back, so it is exactly the script that must not
          # have a shell bug in it.
          shellcheck -e SC1091 scripts/*.sh scripts/vm-tests/*.sh \
            os-image/files/etc/greenboot/check/required.d/*.sh

  changes:
    name: What changed
    # The image job costs eleven minutes and republishes :edge. A commit
    # that cannot change the image — docs, tests, CI, the Justfile — should
    # not trigger it. VERSION is deliberately NOT on the list: CI ticks it
    # for every merge, so it would make the filter always true; the version
    # inside :edge is the version of the last merge that touched the image,
    # and a skipped merge's version simply has no build behind it.
    #
    # Pull requests never build. Every PR used to, "to be safe", and with
    # several open at once that was an eleven-minute build per push per
    # branch for an image nobody would run — the load was judged crazy.
    # The tests, the compile check and shellcheck still run on every PR;
    # the image is built once, from the merge. A first push or a rewritten
    # history still builds, because the diff cannot be trusted there.
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "asked for by hand: building"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "a pull request: the image is built from the merge, not here"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "not an ordinary push: building"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          echo "$changed"
          if echo "$changed" | grep -E -q \
               '^(os-image/|kosherd/src/|kosherd/pyproject|admin-app/src/|store-app/src/|setup-app/src/|myfilter-app/src/|search-app/kosher_search/|mitm/|branding/|policy/|scripts/fetch-categories\.py|scripts/curated-sites\.json|scripts/check-searxng-settings\.py|scripts/version\.py)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "the image changes: building"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "nothing that reaches the image changed: skipping the build"
          fi

  image:
    name: Build OS image
    needs: [unit, compile, shell, changes, version]
    # `version` is skipped on a pull request (nothing is numbered there), so
    # the condition is spelled out rather than relying on the default
    # all-succeeded, which would skip the build with it.
    if: |
      always() && needs.changes.outputs.image == 'true'
      && needs.unit.result == 'success'
      && needs.compile.result == 'success'
      && needs.shell.result == 'success'
      && needs.version.result != 'failure'
      && needs.version.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version tag and its GitHub release
      packages: write
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kosher-linux
      # The commit the image is built from: the version tick on a push, the
      # commit itself on a pull request.
      SHA: ${{ needs.version.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release notes list the commits since the previous version tag
          ref: ${{ needs.version.outputs.sha || github.sha }}

      # Two channels. Every push to master becomes :edge — the maintainer's
      # own daily driver, where every build lands first — plus the
      # commit's sha tag and its version tag. :stable (and :latest, which
      # follows it) is never built here: release-stable.yml promotes an
      # existing signed version by hand, so what families run is a build
      # somebody chose, not the newest commit.
      - name: Build image
        # The version goes into the image's label, which is where bootc
        # reads the "Version:" it shows for the running and the offered build.
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          podman build --build-arg "KOSHER_VERSION=$version" \
            -t "$IMAGE:${SHA::12}" -t "$IMAGE:edge" -f os-image/Containerfile .

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          podman login ghcr.io -u "$GITHUB_ACTOR" -p "${{ secrets.GITHUB_TOKEN }}"
          podman push "$IMAGE:${SHA::12}"
          podman push "$IMAGE:edge"

      - name: Sign (cosign keyless)
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3
      - if: github.event_name != 'pull_request'
        run: |
          # cosign reads Docker's credential store, not podman's auth.json,
          # so it needs its own login to push signatures to ghcr.
          cosign login ghcr.io -u "$GITHUB_ACTOR" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign --yes "$IMAGE:${SHA::12}"
          cosign sign --yes "$IMAGE:edge"

      - name: Tag this version's image
        # The image keeps the version's own tag so a release can point at it
        # and a machine can be moved to it by name. Making the RELEASE is a
        # separate job, because a commit that changes nothing in the image
        # still gets a version and still deserves a release.
        if: github.event_name != 'pull_request'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          podman tag "$IMAGE:${SHA::12}" "$IMAGE:v$version"
          podman push "$IMAGE:v$version"
          cosign sign --yes "$IMAGE:v$version"

  release:
    name: Release this version
    # Every merge carries its own version (VERSION, ticked by the version
    # job above), so every merge that passes the tests gets a release —
    # even one that changed no image file, which would otherwise leave a
    # version with nothing to point at and a gap in the history. A merge
    # whose tests fail gets none, and its changes appear in the next
    # release's notes, which list everything since the previous tag.
    needs: [unit, compile, shell, changes, image, version]
    if: |
      always() && github.event_name == 'push'
      && needs.unit.result == 'success'
      && needs.compile.result == 'success'
      && needs.shell.result == 'success'
      && needs.version.result == 'success'
      && needs.image.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kosher-linux
      SHA: ${{ needs.version.outputs.sha }}
      # "true" only when an image was actually built and pushed for this
      # version. `changes.outputs.image` says whether one was MEANT to be,
      # which is not the same thing when the build fails.
      BUILT: ${{ needs.image.result == 'success' && needs.changes.outputs.image || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the notes list the commits since the previous version
          ref: ${{ needs.version.outputs.sha }}

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; leaving it"
            exit 0
          fi
          git fetch --tags --quiet origin
          previous="$(git tag --list 'v*' --sort=-creatordate | grep -v "^$tag\$" | head -1 || true)"
          # The notes are written by scripts/release-notes.py: grouped into
          # new things, fixes and the rest, each labelled with the part of
          # the product it touched. Keeping them out of this file means they
          # can be read and tested like any other code.
          built=no
          [ "$BUILT" = "true" ] && built=yes
          failed=""
          [ "${{ needs.image.result }}" = "failure" ] && failed=--image-failed
          python3 scripts/release-notes.py --version "$version" --previous "$previous" \
            --sha "$SHA" --image "$IMAGE" --built "$built" $failed \
            --out release-notes.md
          cat release-notes.md
          # Plain 0.x.x now, so the newest build is the latest release
          # rather than something GitHub hides behind a badge.
          gh release create "$tag" --target "$SHA" \
            --title "KosherOS $version" --notes-file release-notes.md

  docs:
    name: Docs site
    # In the same run as the release, and after it, so the Releases page
    # includes the release this run just made. It cannot be its own
    # workflow listening for `release:`: a release created by CI with the
    # default token deliberately does not trigger other workflows, so that
    # page sat several versions behind without anything looking broken.
    needs: [release]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Assemble and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-docs.py --build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
