name: Checks

# Everything that can be verified without a VM or an image build. The
# in-VM integration suites (scripts/vm-tests/) need KVM and a provisioned
# Fedora guest, so they stay a local `just test-vm` step.

on:
  push:
    branches: [master]
  pull_request:
  # "Rebuild and publish edge now", for when the last commits touched
  # nothing in the image and a fresh one is wanted anyway — before
  # promoting a version to stable, for instance.
  workflow_dispatch:

concurrency:
  # One Pages deployment at a time; a second push while one is publishing
  # waits rather than racing it.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# Versions. There is no version job and no VERSION file in the tree: the
# tag is the version, and scripts/version.py works out any commit's number
# from the last tag reachable from it plus what the commits since it say
# (a feat moves the minor, anything else the patch, never the major). The
# image job computes the number and builds it in; the release job, last of
# all, pushes the tag and makes the release. A number is spent only when
# its tag lands, so a run that fails anywhere before that spends nothing
# and the next merge takes the same number.
#
# It used to be a version job that committed a `chore: version` tick to
# master first and built that commit. Every failure downstream of it burned
# a number, and the release step failed for good whenever another commit
# touching a workflow file landed before it ran (GitHub demands a scope the
# Actions token cannot have to release an explicit commit in that case).
# 0.3.0, 0.4.2, 0.5.0 and 0.6.0 were spent that way with no release.

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Python with GObject
        # The daemon imports gi at module level, so every test that touches
        # it needs PyGObject. The distro's python3-gi is the dependable way
        # to get it (pip would build it from source); the runner's system
        # Python is 3.12, the same as the dev shell. nftables: test_nft.py
        # syntax-checks the rendered ruleset with the real parser.
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 python3-pip nftables
          python3 -m pip install --break-system-packages \
            pytest pytest-cov jsonschema cryptography fastapi httpx pillow pyyaml
      - name: Device tests with coverage
        run: |
          cd kosherd
          python3 -m pytest tests/ -q \
            --cov=kosherd --cov-report=term-missing:skip-covered \
            --cov-fail-under=85
      - name: Portal tests
        run: cd portal && PYTHONPATH=src:../kosherd/src python3 -m pytest tests/ -q

  compile:
    name: Apps compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Byte-compile every app
        # The GTK apps and the daemon need GObject typelibs to RUN, which
        # CI has no reason to install — but a syntax error must still fail
        # here rather than in a VM.
        run: |
          python3 -m compileall -q \
            kosherd/src admin-app/src store-app/src setup-app/src \
            myfilter-app/src portal/src mitm

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          # Every tracked shell script except the retired legacy/ prototype
          # — the same set, and the same exclusion, as the pre-commit hook
          # in devenv.nix, so a commit that passes locally passes here.
          # SC1091: lib.sh is sourced at runtime inside the VM.
          # The greenboot health check decides whether a booted image is
          # kept or rolled back, so it is exactly the script that must not
          # have a shell bug in it.
          git ls-files '*.sh' | grep -v '^legacy/' | xargs shellcheck -e SC1091

  changes:
    name: What changed
    # The image job costs eleven minutes and republishes :edge. A commit
    # that cannot change the image — docs, tests, CI, the Justfile — should
    # not trigger it. The version inside :edge is then the version of the
    # last merge that touched the image, and a skipped merge's version
    # simply has no build behind it (its release says so).
    #
    # Pull requests never build. Every PR used to, "to be safe", and with
    # several open at once that was an eleven-minute build per push per
    # branch for an image nobody would run — the load was judged crazy.
    # The tests, the compile check and shellcheck still run on every PR;
    # the image is built once, from the merge. A first push or a rewritten
    # history still builds, because the diff cannot be trusted there.
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "asked for by hand: building"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "a pull request: the image is built from the merge, not here"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "not an ordinary push: building"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$GITHUB_SHA")"
          echo "$changed"
          if echo "$changed" | grep -E -q \
               '^(os-image/|kosherd/src/|kosherd/pyproject|admin-app/src/|store-app/src/|setup-app/src/|myfilter-app/src/|search-app/kosher_search/|mitm/|branding/|policy/|scripts/fetch-categories\.py|scripts/curated-sites\.json|scripts/check-searxng-settings\.py|scripts/version\.py)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo "the image changes: building"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "nothing that reaches the image changed: skipping the build"
          fi

  image:
    name: Build OS image
    needs: [unit, compile, shell, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kosher-linux
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version is counted from the last tag

      # Two channels. Every push to master becomes :edge — the maintainer's
      # own daily driver, where every build lands first — plus the
      # commit's sha tag. The version tag is added by the release job, once
      # the version is settled. :stable (and :latest, which follows it) is
      # never built here: release-stable.yml promotes an existing signed
      # version by hand, so what families run is a build somebody chose,
      # not the newest commit.
      - name: Build image
        # The version is the tag on this commit, or the number the release
        # job will tag it with once this build has passed. The Containerfile
        # writes it into the image and into the label bootc reads for the
        # "Version:" it shows for the running and the offered build.
        run: |
          version="$(python3 scripts/version.py release)"
          echo "this build is $version"
          podman build --build-arg "KOSHER_VERSION=$version" \
            -t "$IMAGE:${SHA::12}" -t "$IMAGE:edge" -f os-image/Containerfile .

      - name: Push
        run: |
          podman login ghcr.io -u "$GITHUB_ACTOR" -p "${{ secrets.GITHUB_TOKEN }}"
          podman push "$IMAGE:${SHA::12}"
          podman push "$IMAGE:edge"

      - name: Sign (cosign keyless)
        uses: sigstore/cosign-installer@v3
      - run: |
          # cosign reads Docker's credential store, not podman's auth.json,
          # so it needs its own login to push signatures to ghcr.
          cosign login ghcr.io -u "$GITHUB_ACTOR" -p "${{ secrets.GITHUB_TOKEN }}"
          cosign sign --yes "$IMAGE:${SHA::12}"
          cosign sign --yes "$IMAGE:edge"

  release:
    name: Release this version
    # Every merge that passes the tests gets a version tag and a release —
    # even one that changed no image file, whose release says there is no
    # new image. A merge whose tests fail gets none, spends no number, and
    # its changes appear in the next release's notes, which list everything
    # since the previous tag.
    needs: [unit, compile, shell, changes, image]
    if: |
      always() && github.event_name == 'push'
      && needs.unit.result == 'success'
      && needs.compile.result == 'success'
      && needs.shell.result == 'success'
      && needs.image.result != 'cancelled'
    # One at a time: two merges close together must count from each
    # other's tags, not race for one number (the tag push is atomic anyway,
    # and the script counts again when it loses; this just keeps the log
    # readable).
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version tag and its release
      packages: write # the image's version tag
      id-token: write # cosign keyless signing of that tag
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kosher-linux
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the version is counted from the last tag; the notes list the commits since it

      - uses: sigstore/cosign-installer@v3

      - name: Tag, then release
        # scripts/publish-releases.py, in this order: push the version tag
        # to this commit (atomic — a number can never be spent twice), copy
        # the sha-tagged image to the version's tag and sign it, create the
        # release on the tag that now exists. Then finish any version tag
        # that has no release yet. The tag is pushed with git and the
        # release names no target commit, because releasing an explicit
        # commit from Actions is refused whenever a workflow file changed
        # after it — which is what left four numbers without a release.
        # The notes come from scripts/release-notes.py; both scripts are
        # read and tested like any other code.
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          skopeo login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"
          cosign login ghcr.io -u "$GITHUB_ACTOR" -p "$GITHUB_TOKEN"
          failed=""
          [ "${{ needs.image.result }}" = "failure" ] && failed=--image-failed
          python3 scripts/publish-releases.py --sha "$GITHUB_SHA" --image "$IMAGE" $failed

  docs:
    name: Docs site
    # In the same run as the release, and after it, so the Releases page
    # includes the release this run just made. It cannot be its own
    # workflow listening for `release:`: a release created by CI with the
    # default token deliberately does not trigger other workflows, so that
    # page sat several versions behind without anything looking broken.
    needs: [release]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Assemble and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-docs.py --build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
