name: Docs site

# The docs at https://aareman.github.io/KosherOS/: the readme as the front
# page, every docs/*.md, and a Releases page assembled from the GitHub
# releases. Rebuilt when the docs change and whenever a release is
# published or edited, so the Releases page never lags a build.

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "readme.md"
      - "mkdocs.yml"
      - "scripts/build-docs.py"
      - ".github/workflows/docs.yml"
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Assemble and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-docs.py --build
      # Pages is enabled on the repository already (build_type: workflow);
      # asking the action to enable it needs a token with admin rights,
      # which GITHUB_TOKEN does not have, and that failed the first build.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
