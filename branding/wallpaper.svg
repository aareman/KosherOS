<?xml version="1.0" encoding="UTF-8"?>
<!-- KosherOS placeholder wallpaper: calm navy gradient with a soft glow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#0b1a33"/>
      <stop offset="55%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.42">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="3840" height="2160" fill="url(#sky)"/>
  <rect width="3840" height="2160" fill="url(#glow)"/>
