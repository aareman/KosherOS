[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kosherd"
version = "0.1.0"
description = "Kosher Linux privileged management daemon, policy engine, and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "jsonschema>=4",
    "cryptography>=42",  # verify signed portal policies
    # PyGObject is used at daemon runtime (D-Bus via Gio). It is installed as the
    # distro package (python3-gobject) rather than from pip; the pure-policy
    # modules (policy/nft/dns/guardian) import nothing from it so tests run anywhere.
]

[project.scripts]
kosherd = "kosherd.daemon:main"
kosherctl = "kosherd.cli:main"
# Runs as the person signing in (a systemd user unit), not as root.
kosher-layout = "kosherd.layout:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kosherd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["kosherd"]
omit = [
    # The D-Bus and GObject surface needs a live system bus, a polkit
    # authority and real system services, so it cannot run here. It is
    # covered by the in-VM suites instead (scripts/vm-tests/, just test-vm)
    # — and the decisions it used to embed now live in access.py, which is
    # fully covered above.
    "*/kosherd/daemon.py",
    "*/kosherd/client.py",
    "*/kosherd/auth.py",
    "*/kosherd/cli.py",
    # The pretend daemon behind `just admin-demo` and `just store-demo`: a
    # development aid that never runs on a machine, and whose "coverage"
    # would only measure the demo data. The apps' own widget tests drive it.
    "*/kosherd/demo.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "except ImportError",
]
