site_name: KosherOS
site_description: A family computer that is filtered, locked down, and still a real computer.
site_url: https://aareman.github.io/KosherOS/
repo_url: https://github.com/aareman/KosherOS
repo_name: aareman/KosherOS
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site
strict: false

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.png
  favicon: images/logo.png
  palette:
    # "custom" hands the colours to docs/stylesheets/brand.css, which takes
    # them from the artwork (branding/wallpaper.png) rather than a stock
    # Material palette.
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light
  font:
    # A Hebrew humanist sans for text and the classic Hebrew book serif for
    # headings: both set English as well as they set Hebrew, which is the
    # right pair for this product.
    text: Assistant
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - What it is: overview.md
  - Releases: releases.md
  - What works: supported.md
  - How it is built:
      - Architecture: architecture.md
      - Content filtering: content-filtering.md
      - Media filtering: media-filtering.md
      - Search: search.md
      - Desktop: desktop.md
      - Branding: branding.md
  - Shipping:
      - Deployment and updates: deployment.md
      - Licensing: licensing.md
      - Third-party notices: third-party.md
      - Testing: testing.md
  - Notes:
      - A standalone filter?: standalone.md

extra_css:
  - stylesheets/brand.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html   # the card grid on the front page
  - tables
  - toc:
      permalink: true
  # The diagram on the front page: Material draws mermaid itself when the
  # fence is handed to it this way, with no script of ours.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
