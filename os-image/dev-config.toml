# bootc-image-builder config for DEV disk images only (just vm).
#
# No preset user: the dev disk boots into the same first-boot wizard a
# family sees, and the administrator is created there. There used to be an
# "abba" account baked in here, and it made the very first wizard run say
# "'abba' already exists" to someone who had no idea it did.

# Dev disks only: sshd on + key-only root ssh, so `just deploy-kosherd
# kosher-gui` can push code into the running GUI VM without a disk rebuild
# (the image has no sudo, so root-by-key is the only dev channel; the root
# password stays locked). @SSH_KEY@ is substituted by the `just vm` recipe.
# Production images ship with sshd disabled and no preset users or keys.
[[customizations.user]]
name = "root"
key = "@SSH_KEY@"

# No services block here: bootc-image-builder did not apply one
# to disk images, so dev disks had no sshd at all. sshd is enabled in the
# image and gated on /root/.ssh/authorized_keys existing (see the sshd
# drop-in in os-image/files), which the root key above provides.
