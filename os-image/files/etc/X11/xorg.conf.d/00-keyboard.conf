# The system keymap: English first, Hebrew ready. This is the file
# `localectl set-x11-keymap` writes, and what systemd-localed serves over
# D-Bus, which is where niri (the advanced desktop) takes its keyboard
# layout from. GNOME uses its own per-account input sources instead (see
# /etc/dconf/db/local.d/30-kosheros-input), set to the same two layouts.
# Alt+Shift switches, as it does on Windows.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "us,il"
        Option "XkbOptions" "grp:alt_shift_toggle"
EndSection
