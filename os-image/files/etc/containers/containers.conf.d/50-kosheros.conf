# KosherOS: what every container starts with.
#
# The filter's certificate, for the tools inside a container that carry
# their own bundle (the same list as /etc/profile.d/kosher-ca.sh on the
# host): the path is where mounts.conf puts the system bundle.
[containers]
env = [
  "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
  "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt",
  "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt",
  "PIP_CERT=/etc/ssl/certs/ca-certificates.crt",
  "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt",
  "CARGO_HTTP_CAINFO=/etc/ssl/certs/ca-certificates.crt",
  "GIT_SSL_CAINFO=/etc/ssl/certs/ca-certificates.crt",
  "NIX_SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt",
  "DENO_TLS_CA_STORE=system",
  "UV_NATIVE_TLS=1",
]
