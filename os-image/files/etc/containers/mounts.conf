# KosherOS: every container trusts the filter's certificate.
#
# In "Filtered internet" mode this computer reads the account's HTTPS with
# its own certificate authority, and a rootless container's traffic is the
# account's. The image inside the container carries its own certificate
# bundle, which does not know that authority, so curl, pip, npm and the
# rest inside it would refuse every download. The system bundle (which
# holds the authority once inspection is set up, and is Fedora's ordinary
# bundle otherwise) is put over the bundle paths the common images read:
# Debian, Ubuntu and Alpine; Fedora, CentOS and RHEL; and the bare
# cert.pem some tools look for. containers.conf.d/50-kosheros.conf names
# the first of these for the tools that carry their own bundle.
# Format: host path:container path, one per line.
/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/etc/ssl/certs/ca-certificates.crt
/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem:/etc/ssl/cert.pem
