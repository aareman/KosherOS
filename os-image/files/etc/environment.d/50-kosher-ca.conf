# KosherOS: developer tools trust the filter's certificate. The same
# variables as /etc/profile.d/kosher-ca.sh, for programs started from the
# desktop (systemd --user reads this) rather than from a login shell.
SSL_CERT_FILE=/etc/pki/tls/certs/ca-bundle.crt
REQUESTS_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt
PIP_CERT=/etc/pki/tls/certs/ca-bundle.crt
NODE_EXTRA_CA_CERTS=/etc/pki/tls/certs/ca-bundle.crt
CARGO_HTTP_CAINFO=/etc/pki/tls/certs/ca-bundle.crt
DENO_TLS_CA_STORE=system
UV_NATIVE_TLS=1
GIT_SSL_CAINFO=/etc/pki/tls/certs/ca-bundle.crt
