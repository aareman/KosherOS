# KosherOS: developer tools trust the filter's certificate. The same
# variables as /etc/profile.d/kosher-ca.sh, for programs started from the
# desktop (systemd --user reads this) rather than from a login shell.
SSL_CERT_FILE=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
REQUESTS_CA_BUNDLE=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
PIP_CERT=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
NODE_EXTRA_CA_CERTS=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
CARGO_HTTP_CAINFO=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
DENO_TLS_CA_STORE=system
UV_NATIVE_TLS=1
GIT_SSL_CAINFO=/etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
