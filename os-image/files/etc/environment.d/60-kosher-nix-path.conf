# KosherOS: what the Store installs from nixpkgs is on the session's PATH.
#
# A nixpkgs app goes into the account's own Nix profile. A bash terminal
# finds it through /etc/profile.d/nix.sh; a program the desktop starts,
# or a shell that does not read the profile scripts, does not. This puts
# the profile on the PATH systemd --user hands to everything in the
# session, after the system's own directories.
#
# Those directories are written out in full on purpose. The line once
# read "...:${PATH}", and in the login screen's launch environment that
# expands to nothing: the greeter's PATH was two Nix directories and no
# /usr/bin, gnome-session could start nothing, and 0.13.0 booted to a
# black screen (#110). Nothing an expansion does can take /usr/bin out
# of this value. (The data-directory list was once replaced the same
# way and took the login screen down as well; only an addition that
# keeps the system's directories belongs here.)
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.nix-profile/bin:/nix/var/nix/profiles/default/bin
