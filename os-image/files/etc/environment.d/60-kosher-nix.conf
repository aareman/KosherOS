# KosherOS: apps installed from nixpkgs show up on the desktop.
#
# A nixpkgs app the Store installs goes into the account's own Nix
# profile, and its .desktop file and icon with it. GNOME finds them when
# the profile's share directory is on XDG_DATA_DIRS for the session —
# which /etc/profile.d/nix.sh does for shells, and this does for what
# systemd --user starts (the Shell, the app grid). Both profile paths nix
# has used, then the system profile; the defaults stay first.
XDG_DATA_DIRS=${XDG_DATA_DIRS:-/usr/local/share:/usr/share}:${HOME}/.local/state/nix/profile/share:${HOME}/.nix-profile/share:/nix/var/nix/profiles/default/share
