# The computer's own keyd configuration. It remaps nothing, so a keyboard
# works as it always has: at the login screen, for anyone who has not
# written their own files in ~/.config/keyd (see the Desktop page of the
# KosherOS documentation), and for keyboards their files do not name. Each
# person's own files apply only while their session is the one on the
# screen.
#
# keyd reads /run/keyd, not this file: keyd.service copies this file there
# each time it starts, and kosherd puts a person's files beside it (or in
# its place, when one of theirs is for every keyboard).
[ids]
*

[main]
