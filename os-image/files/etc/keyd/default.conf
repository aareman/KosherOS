# The computer's own keyd configuration. It remaps nothing, so a keyboard
# works as it always has: at the login screen, and for anyone who has not
# written their own ~/.config/keyd/default.conf (see the Desktop page of
# the KosherOS documentation). Each person's own file applies only while
# their session is the one on the screen.
#
# keyd reads /run/keyd, not this file: keyd.service copies this file there
# each time it starts, and kosherd puts a person's file there in its place.
[ids]
*

[main]
