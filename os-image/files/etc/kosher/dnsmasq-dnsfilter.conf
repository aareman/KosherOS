# The resolver for DNSFILTER accounts only.
#
# Those accounts have no proxy, so the categories they block are blocked
# here, by name. Filtered accounts and the proxy use the family resolver,
# where nothing is blocked by category: the proxy decides those, and it can
# only show its block page for a name that resolved to the real site.
# kosherd redirects dnsfilter accounts here (see kosherd/nft.py).
listen-address=127.0.0.1
port=5356
bind-interfaces
user=dnsmasq

no-resolv
server=1.1.1.3
server=1.0.0.3

cache-size=10000

# Every address handed out goes into the dns4/dns6 sets, and those are the
# only addresses a dnsfilter account may open a web connection to: an
# address it never looked up is refused.
nftset=/#/4#inet#kosher#dns4,6#inet#kosher#dns6

# What the family resolver has (safe search, ads, the whitelist sets),
# then this resolver's own: the category blocks.
conf-dir=/etc/kosher/dnsmasq.d/,*.conf
conf-dir=/etc/kosher/dnsmasq-dnsfilter.d/,*.conf
