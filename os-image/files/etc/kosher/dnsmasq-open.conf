# The resolver for UNFILTERED users only.
#
# One dnsmasq cannot give different answers to different users on the same
# machine, and the main resolver rewrites search engines to their safe-search
# hostnames. Unfiltered users are redirected here instead (see kosherd/nft.py),
# where nothing is rewritten and the upstream is not the family filter.
listen-address=127.0.0.1
port=5354
bind-interfaces
user=dnsmasq

no-resolv
server=1.1.1.1
server=1.0.0.1

cache-size=2000
