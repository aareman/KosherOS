# Kosher Linux resolver. The ONLY resolver on this system:
# systemd-resolved is masked, NetworkManager runs with dns=none, and nftables
# redirects every human user's port-53 traffic here.
listen-address=127.0.0.1
bind-interfaces
user=dnsmasq

# Never read /etc/resolv.conf or DHCP-provided servers; the family filter
# upstream is hardcoded.
no-resolv
server=1.1.1.3
server=1.0.0.3

# Cache aggressively; the upstream is remote.
cache-size=10000

# Rendered whitelist drop-in (kosherd owns this directory).
conf-dir=/etc/kosher/dnsmasq.d/,*.conf
