# KosherOS: Nix, for every account, on a filtered machine.
#
# This replaces the nix.conf Fedora's package ships; its settings are the
# first block below, kept as they are. The image is read-only, so the store
# lives on /var and is bind-mounted here at boot (nix.mount).

auto-optimise-store = true
bash-prompt-prefix = (nix:$name)\040
experimental-features = nix-command flakes
extra-nix-path = nixpkgs=flake:nixpkgs
max-jobs = auto
# The system bundle, which carries the filter's certificate once inspection
# is set up: a filtered account's own fetches (flake inputs, tarballs) go
# through the proxy like everything else it opens.
ssl-cert-file = /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem

# Builds run in the sandbox as the nixbld users. A fixed-output build is
# the one kind that may use the network, and it does so as nixbld, outside
# any account's filter; the firewall gives that group the registries and
# the system domains and nothing else (nft.py, chain nix_build).
sandbox = true
build-users-group = nixbld

# Only root may change the daemon's own settings: a trusted user can add a
# binary cache, and the daemon downloads as root, unfiltered.
trusted-users = root

# Who may use the daemon at all. kosherd writes the list from the policy
# (every managed account whose kind of internet is not "No internet") to
# the file included at the end; until it has, nobody but root. An account
# with no internet gets none through a build either.
allowed-users = root

# devenv's cache, so a devenv shell is downloaded rather than compiled. A
# cache is a place to get a build that would otherwise happen here; the
# key is the one devenv publishes (https://devenv.cachix.org).
extra-substituters = https://devenv.cachix.org
extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

!include /etc/nix/kosheros-users.conf
