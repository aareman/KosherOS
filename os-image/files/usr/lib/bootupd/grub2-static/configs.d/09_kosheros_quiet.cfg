### BEGIN 09_kosheros_quiet.cfg ###
# KosherOS: boot straight into the system instead of showing the menu.
# A family does not choose between deployments at boot: going back after a
# bad update is done from KosherOS Admin, or by greenboot on its own, and
# neither needs the menu. bootupd concatenates this into grub.cfg at
# install time, after the static preamble that sets the default timeout.
#
# Hidden, not gone: the countdown runs silently for one second, and
# holding Shift (BIOS) or pressing Esc (UEFI) during it opens the menu, so
# a machine that will not start can still be reached.
set timeout_style=hidden
set timeout=1
### END 09_kosheros_quiet.cfg ###
