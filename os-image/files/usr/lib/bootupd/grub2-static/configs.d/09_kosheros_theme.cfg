### BEGIN 09_kosheros_theme.cfg ###
# KosherOS: draw the boot menu in the product's colours with its mark,
# instead of GRUB's white-on-black text. bootupd concatenates this into
# grub.cfg at install time (--with-static-configs), after 08_greenboot and
# before 10_blscfg lists the entries.
#
# The theme has to be somewhere GRUB can read before the OS is up, and
# that differs by firmware. On UEFI, ${cmdpath} is the EFI system partition
# directory GRUB was loaded from (EFI/fedora), and bootupd copied the theme
# there from /usr/lib/efi/kosheros-grub-theme. On BIOS, ${prefix} is the
# boot partition's grub2/, and grub2-install copied the theme there from
# /usr/share/grub/themes/starfield. Both are tried; if neither the theme
# nor a font can be found, nothing changes and the plain menu is shown.
set kosheros_theme=
set kosheros_font=
if [ -f ${cmdpath}/kosheros/theme.txt ]; then
  set kosheros_theme=${cmdpath}/kosheros/theme.txt
  set kosheros_font=${cmdpath}/kosheros/unicode.pf2
elif [ -f ${prefix}/themes/starfield/theme.txt ]; then
  set kosheros_theme=${prefix}/themes/starfield/theme.txt
  set kosheros_font=${prefix}/fonts/unicode.pf2
fi
if [ -n "${kosheros_theme}" ]; then
  if loadfont ${kosheros_font}; then
    # On BIOS, VBE only. With all_video, GRUB hung before the kernel on a
    # BIOS machine with no video device at all (a serial console, which is
    # how `just test-boot` boots). VBE alone does not hang there, and every
    # BIOS graphics card answers VBE, so the menu looks the same.
    if [ "${grub_platform}" = "pc" ]; then
      insmod vbe
    else
      insmod all_video
    fi
    insmod gfxterm
    insmod png
    set gfxmode=auto
    terminal_output gfxterm
    set theme=${kosheros_theme}
    export theme
  fi
fi
unset kosheros_theme
unset kosheros_font
### END 09_kosheros_theme.cfg ###
