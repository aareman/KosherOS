# The KosherOS splash in the initramfs, so an encrypted disk's password is
# asked for on the splash and not on a text console (#316).
add_dracutmodules+=" plymouth "
# Not the big graphics drivers that plymouth's drm module would bring:
# with their firmware they were 146 MB of a 269 MB initramfs, which the
# boot loader reads from disk at every start (15 seconds on a laptop).
# The splash draws on simpledrm, built into the kernel, on the screen the
# firmware set up; the real driver loads from the system a moment later.
omit_drivers+=" amdgpu radeon nouveau i915 xe "
