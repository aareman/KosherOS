# KosherOS: the root partition takes the whole disk on real hardware too.
#
# The installer's automatic partitioning stops the root partition at
# 70 GiB (Anaconda's cap) and leaves the rest of a larger disk unallocated.
# bootc's own unit grows the root partition into that space at boot, but
# upstream runs it only in virtual machines — which is why every VM test
# had the whole disk and a laptop installed from the same ISO had 178 GB
# sitting unused and ran out of room for an update (#113).
#
# The upstream script only ever extends the last partition into free
# space after it, and only when the root is a plain partition (not LVM);
# nothing on the disk is erased or moved. Someone keeping free space on
# purpose, for another system beside KosherOS, says so with an empty
# file at /etc/kosher/keep-disk-layout.
[Unit]
ConditionVirtualization=
ConditionPathExists=/usr/bin/growpart
ConditionPathExists=!/etc/kosher/keep-disk-layout
