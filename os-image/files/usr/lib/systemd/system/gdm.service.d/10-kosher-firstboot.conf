# The login screen must not race the first-boot wizard.
#
# Both units are wanted by graphical.target. The wizard previously used
# Conflicts=gdm.service to win, but that is a race, and GDM won: the machine
# came up at a login screen with no accounts, GNOME Initial Setup created one
# outside KosherOS, and that account was not in kosher-admin — so every admin
# action then hit a polkit prompt that could never be satisfied.
#
# Ordering after a Type=oneshot wizard is deterministic: GDM waits for it to
# finish. After= does not require success, so a failed wizard still leaves a
# usable login screen rather than a machine that never boots to a desktop.
[Unit]
After=kosher-firstboot.service
