# Run the health check after the filter has had its chance to come up.
#
# Stock greenboot starts the check right after basic.target, which on this
# image is BEFORE kosherd has started and while kosherd's first policy apply
# is restarting the resolver. The required check saw "activating" and a
# resolver mid-restart, called the boot red, and greenboot rebooted the
# machine — a fresh disk that never reached the setup wizard, twice in a
# row (build/qcow2/console.log, 2026-09-10). Ordering after the filter's
# own units, plus the bounded waits inside the check, is what makes the
# check ask "did the filter come up" instead of "was it up 9 seconds in".
[Unit]
After=kosher-firewall.service kosherd.service kosher-dns.service
