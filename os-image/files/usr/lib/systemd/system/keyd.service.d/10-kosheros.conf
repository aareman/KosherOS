# keyd is built for KosherOS to read /run/keyd (see the Containerfile),
# where kosherd writes the config of whoever's session is on the screen
# (kosherd/keyboard.py). Every start begins from the computer's own
# config, which remaps nothing: at boot, and also after keyd's panic keys
# (Backspace+Escape+Enter) stop it because a remap went wrong.
[Unit]
Documentation=file:///usr/share/doc/kosher/desktop.md
Before=display-manager.service

[Service]
ExecStartPre=/usr/bin/install -D -m 0644 /etc/keyd/default.conf /run/keyd/default.conf
Restart=always
RestartSec=1
