[Service]
# Nix must create namespaces, mount build roots, change to nixbld users,
# preserve store ownership and kill its builders. Do not give it module,
# clock, boot, raw-I/O or networking-administration privileges on the host.
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_FSETID CAP_KILL CAP_SETGID CAP_SETUID CAP_SETPCAP CAP_SYS_ADMIN CAP_SYS_CHROOT CAP_SYS_PTRACE CAP_MKNOD
ProtectSystem=strict
ReadWritePaths=/nix /var/lib/nix
# Binary-cache metadata must remain writable or Nix silently stops using
# substitutes and rebuilds package closures. Keep it out of root's home.
CacheDirectory=nix
Environment=XDG_CACHE_HOME=/var/cache
ProtectHome=read-only
PrivateTmp=yes
ProtectKernelModules=yes
ProtectClock=yes
LockPersonality=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
# ProtectKernelTunables/ProtectKernelLogs mask parts of /proc. That stops
# a nested user namespace mounting procfs, which disables Nix's sandbox.
# Keep /proc visible; the capability set still drops SYSLOG and SYS_MODULE.
# PrivateDevices/RestrictNamespaces/ProtectControlGroups would interfere
# with Nix's own sandbox and optional cgroup management. CAP_SYS_ADMIN is
# required for that sandbox; this is defense in depth, not confinement of
# a hostile daemon with mount privileges.
