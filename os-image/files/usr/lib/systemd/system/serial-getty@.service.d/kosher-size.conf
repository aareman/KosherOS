# A serial line has no size (the kernel reports 0x0), and when a unit's
# terminal has none, systemd asks the terminal with escape sequences and
# reads the answer from the same line. At the login prompt that took the
# password: the user name got through, "Password:" was shown, what was
# typed next never reached login, and it timed out (#180). The first-boot
# wizard had the same fault on the console (#177). Giving the line a size
# means nobody asks. 80x24 is what a serial terminal assumes anyway, and
# `stty rows R cols C` changes it for a session that wants more.
[Service]
TTYRows=24
TTYColumns=80
