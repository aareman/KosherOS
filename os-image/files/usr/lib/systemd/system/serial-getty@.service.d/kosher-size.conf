# A serial line has no size (the kernel reports 0x0), and when a unit's
# terminal has none, systemd asks the terminal with escape sequences and
# reads the answer from the same line. The first-boot wizard lost what was
# typed to this on the console (#177). Giving the line a size means nobody
# asks. 80x24 is what a serial terminal assumes anyway, and
# `stty rows R cols C` changes it for a session that wants more.
[Service]
TTYRows=24
TTYColumns=80
