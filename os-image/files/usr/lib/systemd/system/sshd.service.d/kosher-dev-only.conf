# sshd runs where root has an authorized_keys file, or where kosherd has
# written who may sign in over SSH. Production has no root key — root is
# locked and there is no sudo, so nothing can create it — and kosherd
# writes 40-kosheros.conf only while an administrator has "Sign in over
# SSH" on for an account with developer tools (kosherd/sshin.py). With
# neither, the condition fails cleanly and sshd stays off.
# The dev disk config (os-image/dev-config.toml) injects the developer's
# key, which is what makes `just vm` disks reachable as root over the vsock
# and TCP sockets. This replaced a build-time `systemctl disable sshd`,
# which bootc-image-builder's services customization could not override:
# dev disks ended up with no ssh at all, and no way to read a journal.
[Unit]
ConditionPathExists=|/root/.ssh/authorized_keys
ConditionPathExists=|/etc/ssh/sshd_config.d/40-kosheros.conf
