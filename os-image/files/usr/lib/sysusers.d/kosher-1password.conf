# 1Password's groups (#234), fixed so they are the same on every machine.
# The desktop app trusts an `op` process only when its group is
# onepassword-cli; kosherd keeps /run/wrappers/bin/op setgid to it
# (kosherd/onepassword.py). Nobody is a member: the group comes from the
# setgid bit, not from an account. `onepassword` is the browser
# integration's group, for when that is done.
g onepassword-cli 851
g onepassword 852
