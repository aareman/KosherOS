# Who may run the nix program (#214): root, and the accounts kosherd puts
# here because an administrator switched developer tools on for them
# (kosherd/nixdaemon.py). The gid is fixed because /usr/bin/nix is owned by
# it in the image, and a machine updated from an older image gets the group
# from this file at boot rather than from the image's /etc/group.
g kosher-nix 850
