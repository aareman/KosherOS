# Chromium-based browsers are told never to use DNS-over-HTTPS (F4 in #33),
# so the names they look up go to the family resolver like everyone else's.
#
# The policy itself is in /etc: /etc/chromium for Chromium, and the paths
# Chrome, Edge and Brave read. Their Flatpaks see the host's /etc and link
# those files into their own at every start. The Chromium and
# ungoogled-chromium Flatpaks do not see the host's /etc. They read
# policies from an extension point, and an extension nobody installed is a
# directory in the system Flatpak installation, so that directory points at
# /etc/chromium. /var is not replaced when the image is, which is why these
# are tmpfiles lines rather than files in the image: they come back at
# every boot.
d /var/lib/flatpak/extension 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Extension.system-policies 0755 root root -
d /var/lib/flatpak/extension/org.chromium.Chromium.Extension.system-policies/x86_64 0755 root root -
L+ /var/lib/flatpak/extension/org.chromium.Chromium.Extension.system-policies/x86_64/1 - - - - /etc/chromium
d /var/lib/flatpak/extension/io.github.ungoogled_software.ungoogled_chromium.Extension.system-policies 0755 root root -
d /var/lib/flatpak/extension/io.github.ungoogled_software.ungoogled_chromium.Extension.system-policies/x86_64 0755 root root -
L+ /var/lib/flatpak/extension/io.github.ungoogled_software.ungoogled_chromium.Extension.system-policies/x86_64/1 - - - - /etc/chromium
