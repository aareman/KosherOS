# Where the block page's "ask for this page" requests land.
#
# 0730 root:kosher-spool — the filtering proxy and the search service run
# as members of that group and may CREATE a request here; they cannot list
# the directory or read anyone else's. kosherd, which runs as root, is the
# only reader, and nothing in a request carries any authority anyway.
d /var/lib/kosher-requests 0730 root kosher-spool -

# What the filter did, for the admin app's activity view and the counts
# on the family board. Same arrangement as the requests: the proxy and the
# search service each append to their own file here and cannot read the
# others'; kosherd is the only reader and trims it to a week.
d /var/lib/kosher-activity 0730 root kosher-spool -

# Admin- and portal-supplied list overrides.
#
# 0755 and world readable on purpose: it holds nothing but word lists and
# domain lists, and the two processes that do the filtering are both
# unprivileged. These used to live under /var/lib/kosher, which is 0700
# because it holds the policy — so neither service could read a single
# override and both silently used the shipped copy instead.
d /var/lib/kosher-lists 0755 root root -
d /var/lib/kosher-lists/categories 0755 root root -
# Signed list updates from the portal. Between what shipped and what this
# family changed, so a list can improve without an OS rebuild and without
# discarding a parent's edits.
d /var/lib/kosher-lists/portal 0755 root root -
