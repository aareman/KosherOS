# Where the block page's "ask for this page" requests land.
#
# 0730 root:kosher-spool — the filtering proxy and the search service run
# as members of that group and may CREATE a request here; they cannot list
# the directory or read anyone else's. kosherd, which runs as root, is the
# only reader, and nothing in a request carries any authority anyway.
d /var/lib/kosher-requests 0730 root kosher-spool -
