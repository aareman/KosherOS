# KosherOS seed for Noctalia, the shell of the advanced (niri) desktop.
#
# kosher-layout copies this to ~/.config/noctalia/config.toml the first time
# an account signs in to the niri session, and never touches it again: from
# then on it is the person's own. Noctalia reads only the user's
# configuration, so there is no system-wide place to put these instead.
#
# Every key not listed here is Noctalia's own default. The two that matter:
#   - the polkit agent, without which the admin app's password prompts have
#     nowhere to appear in this session;
#   - the KosherOS wallpaper, so the advanced desktop is still recognisably
#     the same machine.

[shell]
polkit_agent = true
telemetry_enabled = false

[theme]
# Light, to match the login screen and the classic desktop, and the
# KosherOS colours: Noctalia takes its palette from the wallpaper (the
# sand, amber and olive of the artwork), so the advanced desktop looks
# like this machine rather than like Noctalia's own dark default. The
# bundled palettes (Catppuccin, Nord, Gruvbox and the rest) stay a click
# away in the shell's settings; a choice made there is written to
# ~/.local/state/noctalia/settings.toml and wins over this seed.
mode = "light"
shell_mode = "follow"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"
pure_black_dark = false

[wallpaper]
enabled = true
directory = "/usr/share/backgrounds/kosheros"
fill_mode = "crop"

# The wallpaper every output starts with, which is also what the palette
# above is generated from. rasters.py writes this file at image build.
[wallpaper.default]
path = "/usr/share/backgrounds/kosheros/kosheros.png"

[lockscreen]
enabled = true

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"

[bar.main]
position = "top"
# Noctalia's default end widgets plus the keyboard-layout switcher: the
# machine has English and Hebrew set up, and the switch has to be visible.
end = ["media", "tray", "keyboard_layout", "notifications", "clipboard",
       "network", "bluetooth", "volume", "brightness", "battery",
       "control-center", "session"]

[dock]
enabled = true
position = "bottom"
