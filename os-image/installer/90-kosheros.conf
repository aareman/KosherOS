# KosherOS: loaded after Fedora's profile (see /etc/anaconda/profile.d).
[User Interface]
webui_web_engine = firefox
# The installer asks for the disk and nothing else. Language, keyboard and
# time zone come from the kickstart (the first-boot wizard asks where the
# computer is and sets the time zone); accounts are the wizard's.
hidden_webui_pages =
    anaconda-screen-language
    anaconda-screen-date-time
    anaconda-screen-accounts
    anaconda-screen-software-selection

# What "use the entire disk" produces: a plain ext4 root and nothing else,
# no swap and no separate /home, taking the whole disk. The GTK installer
# capped it at 70 GiB and the root grew on first boot (#113); here the cap
# is left off.
[Storage]
default_scheme = PLAIN
file_system_type = ext4
swap_is_recommended = False
default_partitioning =
    / (min 1 GiB)
