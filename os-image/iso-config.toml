# bootc-image-builder config for the INSTALLER ISO (the one people install from).
#
# No users and no passwords are baked in: the installed machine runs the
# KosherOS first-boot wizard, which creates the administrator account.
#
# The disk question is answered as far as it safely can be, and no further.
# A %pre script looks at the machine: if there is exactly one internal,
# non-removable disk that is not the stick the installer booted from, it
# names that disk (ignoredisk --only-use), so Installation Destination shows
# the right disk and nothing else. It deliberately writes NO partitioning.
# A kickstart that also carried clearpart/autopart was complete, and a
# complete kickstart is one Anaconda acts on by itself: a one-disk machine
# was erased and installed about five minutes after power-on with no key
# pressed and no click (#134) — on a laptop with Windows on its only disk,
# a wipe with no confirmation. Without the partitioning the hub stops at
# Installation Destination ("Kickstart insufficient"), the person opens it,
# sees the chosen disk, and Anaconda's own reclaim dialog says what will be
# erased before Begin Installation does anything. With two or more
# candidate disks the script writes nothing and the person picks the disk.
# For repeat VM rehearsals that may wipe everything unattended, use
# os-image/iso-config-unattended.toml (just iso-unattended).
#
# What "Automatic" in that spoke produces — a plain ext4 root and nothing
# else, no swap, no separate /home — is set in the installer's product
# configuration (scripts/brand-iso.py, [Storage]), the same shape the
# kickstart used to write. Anaconda caps the root at 70 GiB and leaves the
# rest of a larger disk unallocated; the installed system grows the root
# into that space on its first boot: bootc's growpart unit, which the image
# lets run on real hardware as well as in a VM (see
# files/usr/lib/systemd/system/bootc-generic-growpart.service.d, #113).
#
# Language, keyboard and time zone are answered here; the spokes for them
# (and for network, source and software, which an offline bootc install
# never needs) are hidden by the product.img drop-in scripts/brand-iso.py
# puts on the ISO, so the hub is the disk and the button.

[customizations.installer.kickstart]
contents = '''
timezone America/New_York --utc
keyboard us
lang en_US.UTF-8
reboot --eject

%pre --interpreter=/bin/bash --log=/tmp/kosher-pre.log
# Pick the disk when there is only one to pick.
set -u
out=/tmp/kosher-disk.ks
: > "$out"

# The device the installer itself is running from must never be a target.
media=""
src=$(findmnt -n -o SOURCE /run/install/repo 2>/dev/null || true)
if [ -n "$src" ]; then
    media=$(lsblk -n -o PKNAME "$src" 2>/dev/null | head -1)
    [ -n "$media" ] || media=$(basename "$src")
fi

candidates=()
for path in /sys/block/*; do
    name=$(basename "$path")
    case "$name" in
        loop*|zram*|ram*|sr*|dm-*|md*) continue ;;
    esac
    [ "$(cat "$path/removable" 2>/dev/null)" = "0" ] || continue
    [ "$name" = "$media" ] && continue
    size=$(cat "$path/size" 2>/dev/null || echo 0)   # 512-byte sectors
    [ "$size" -ge 41943040 ] || continue              # at least 20 GiB
    candidates+=("$name")
done

echo "install medium: ${media:-unknown}; candidate disks: ${candidates[*]:-none}"
if [ "${#candidates[@]}" -eq 1 ]; then
    disk="${candidates[0]}"
    # Only the disk. No clearpart, no autopart: with those the kickstart is
    # complete and Anaconda installs without a click (#134).
    echo "ignoredisk --only-use=$disk" > "$out"
    echo "one internal disk ($disk): shown as the destination; the person still confirms"
else
    echo "not exactly one internal disk: Anaconda will ask"
fi
%end
%include /tmp/kosher-disk.ks
'''

[customizations.installer.modules]
# Trim the installer to what KosherOS needs: no user creation (the wizard
# does that) and no subscription screens.
disable = [
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
