[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kosherportal"
version = "0.1.0"
description = "KosherOS portal — remote filter configuration and device sync"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "cryptography>=42",
    "jsonschema>=4",
]

[project.scripts]
kosher-portal = "kosherportal.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/kosherportal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
